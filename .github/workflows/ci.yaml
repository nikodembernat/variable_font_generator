name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The generator itself is pure Dart. Running it without a Flutter SDK anywhere
  # in sight is the point: the package has to be usable by anyone with only the
  # Dart SDK, and this job would fail the moment a Flutter import crept in.
  generator:
    name: generator (dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, '3.13.0']
    defaults:
      run:
        working-directory: packages/variable_font_generator
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - run: dart pub get

      # The formatter's output changes between SDK releases, so it is only
      # enforced on one of them.
      - name: dart format
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .

      - run: dart analyze --fatal-infos

      - run: dart test --reporter=expanded

  # The generated Flutter package, rendered by the real Flutter engine. This is
  # what proves the variation axes actually reach Skia: a font whose fvar or
  # gvar is subtly wrong renders without complaint and simply refuses to change
  # shape, which only a picture can catch.
  flutter:
    name: flutter goldens
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/lucide_variable_icons
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --reporter=expanded

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: packages/lucide_variable_icons/test/failures/
          if-no-files-found: ignore

      # The generated icons have to stay legible to Flutter's icon tree
      # shaker, and the way they could stop being so is silent: the font would
      # simply arrive with every icon in it. Only a real release build shows
      # that, and only a web one, which has no whole-program pass to fall back
      # on.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools
        working-directory: ${{ github.workspace }}
      - run: ./tool/check_tree_shaking.sh
        working-directory: ${{ github.workspace }}

  # The reusable action, run the way anybody else would run it, on each of the
  # three operating systems GitHub offers. It compiles the generator from this
  # checkout rather than downloading a release, which is what a pull request
  # needs: the point is to catch a change here breaking the action before it is
  # tagged, not to test the last release again.
  action:
    name: the action on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - id: icons
        uses: ./
        with:
          icons: packages/variable_font_generator/test/fixtures/lucide
          output: build/action
          class-name: ActionIcons
          extension-name: ActionIconData
          package: action_icons
          codepoints: build/action/codepoints.json
          mirror-rtl: arrow-right,navigation

      - name: check what it wrote
        env:
          FONT: ${{ steps.icons.outputs.font }}
          BINDINGS: ${{ steps.icons.outputs.bindings }}
          CODEPOINTS: ${{ steps.icons.outputs.codepoints }}
          ICON_COUNT: ${{ steps.icons.outputs.icon-count }}
          FONT_BYTES: ${{ steps.icons.outputs.font-bytes }}
        run: |
          # Windows paths come back with backslashes, which is right for the
          # runner and wrong for the shell reading them here.
          FONT=${FONT//\\//}
          BINDINGS=${BINDINGS//\\//}
          CODEPOINTS=${CODEPOINTS//\\//}

          for path in "$FONT" "$BINDINGS" "$CODEPOINTS"; do
            test -s "$path" || { echo "::error::$path is missing or empty"; exit 1; }
          done

          test "$ICON_COUNT" = 45
          test "$FONT_BYTES" -gt 100000

          # The class names the font, and naming a package moves nothing:
          # everything sits where output said, not under a lib/ nobody asked
          # for.
          test "$FONT" = build/action/fonts/ActionIcons.ttf
          test ! -e build/action/lib
          test ! -e build/action/pubspec.yaml

          grep -q "extension type const ActionIconData" "$BINDINGS"
          grep -q "abstract final class ActionIcons" "$BINDINGS"
          grep -q "fontFamily: 'ActionIcons'" "$BINDINGS"
          grep -q "fontPackage: 'action_icons'" "$BINDINGS"
          grep -q "matchTextDirection: true" "$BINDINGS"
          grep -c "static const ActionIconData" "$BINDINGS" | grep -qx 45

          # A TrueType outline font starts with the version 1.0 sfnt tag.
          head -c 4 "$FONT" | od -An -tx1 | tr -d ' \n' | grep -qx 00010000

      # The same icons again with no class to put bindings in, which is the
      # path a project that is not Flutter's takes.
      - id: font-only
        uses: ./
        with:
          icons: packages/variable_font_generator/test/fixtures/lucide
          output: build/font-only

      - name: check it wrote a font and nothing else
        env:
          FONT: ${{ steps.font-only.outputs.font }}
          BINDINGS: ${{ steps.font-only.outputs.bindings }}
        run: |
          test -s "${FONT//\\//}"
          test -z "$BINDINGS"
          test -z "$(find build/font-only -name '*.dart')"

  # Everything above checks the generator against its own idea of what a font
  # is. This job checks it against everyone else's: the OpenType Sanitizer
  # decides whether a browser would load the file, fontTools parses every table,
  # HarfBuzz shapes with it, FreeType rasterises it, and resvg rasterises the
  # source artwork so the two pictures can be compared.
  independent-verification:
    name: verify against fontTools, FreeType, resvg and OTS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r tool/requirements.txt

      - name: build the font
        run: |
          cd packages/variable_font_generator
          dart pub get
          dart run bin/variable_font_generator.dart build test/fixtures/lucide \
            --output ../../build/verify \
            --family LucideVariable \
            --codepoints ../../build/verify/codepoints.json

      - name: verify it
        run: |
          python3 tool/verify_font.py \
            --icons packages/variable_font_generator/test/fixtures/lucide \
            --font build/verify/fonts/LucideVariable.ttf \
            --codepoints build/verify/codepoints.json \
            --report build/verify/comparison.png

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-comparison
          path: build/verify/comparison.png
          if-no-files-found: ignore
