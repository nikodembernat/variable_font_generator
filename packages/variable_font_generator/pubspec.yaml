name: variable_font_generator
description: >-
  Generates a variable OpenType/TrueType icon font from a directory of SVG
  icons, together with ready-to-use Flutter IconData bindings. Supports the
  FILL, wght, GRAD and opsz axes that Flutter's Icon widget exposes.
version: 0.1.0
repository: https://github.com/nikodembernat/variable_font_generator
issue_tracker: https://github.com/nikodembernat/variable_font_generator/issues
topics:
  - fonts
  - icons
  - svg
  - opentype
  - flutter

environment:
  sdk: ^3.13.0

dependencies:
  args: ^2.7.0
  collection: ^1.19.1
  meta: ^1.19.0
  path: ^1.9.1
  recase: ^4.1.0
  xml: ^7.0.1

dev_dependencies:
  leancode_lint: ^27.0.0
  test: ^1.31.2

executables:
  variable_font_generator:
