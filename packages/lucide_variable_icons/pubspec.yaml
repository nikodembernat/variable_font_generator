name: lucide_variable_icons
description: >-
  Lucide icons as a variable OpenType font, with Flutter bindings. Every icon
  responds to Icon's fill, weight, grade and opticalSize. Generated by
  package:variable_font_generator.
version: 1.0.0
repository: https://github.com/nikodembernat/variable_font_generator
publish_to: none
topics:
  - icons
  - fonts
  - lucide

environment:
  sdk: ^3.13.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  leancode_lint: ^27.0.0

flutter:
  fonts:
    - family: LucideVariable
      fonts:
        - asset: lib/fonts/LucideVariable.ttf
